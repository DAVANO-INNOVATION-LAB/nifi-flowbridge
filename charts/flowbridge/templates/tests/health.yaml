{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-health" (include "flowbridge.fullname" . | trunc 56 | trimSuffix "-") }}
  labels:
    {{- include "flowbridge.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "flowbridge.fullname" . }}
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 60
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ include "flowbridge.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- include "flowbridge.containerSecurityContext" . | nindent 8 }}
      command:
        - python
        - -c
        - {{ printf "import json, urllib.request; response=json.load(urllib.request.urlopen('http://%s:8790/api/health', timeout=10)); assert response.get('status') == 'ok', response; print('Flowbridge service health passed')" (include "flowbridge.fullname" .) | quote }}
      env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      resources:
        requests:
          memory: 32Mi
          cpu: 10m
        limits:
          memory: 128Mi
          cpu: 250m
{{- end }}
