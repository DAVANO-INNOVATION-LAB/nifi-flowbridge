name: flowbridge-continuous
services:
  source-s3:
    image: adobe/s3mock:5.1.0
    mem_limit: 512m
    cpus: 1
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  target-s3:
    image: adobe/s3mock:5.1.0
    mem_limit: 512m
    cpus: 1
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  nifi:
    image: apache/nifi:2.12.0
    mem_limit: 1g
    cpus: 2
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: flowbridge-test
      SINGLE_USER_CREDENTIALS_PASSWORD: ${CONTINUOUS_TEST_PASSWORD:?temporary password required}
      NIFI_JVM_HEAP_INIT: 256m
      NIFI_JVM_HEAP_MAX: 512m
      NIFI_WEB_HTTPS_HOST: localhost
      AWS_ACCESS_KEY_ID: synthetic-only
      AWS_SECRET_ACCESS_KEY: synthetic-only
      AWS_REGION: us-east-1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  default:
    internal: true
