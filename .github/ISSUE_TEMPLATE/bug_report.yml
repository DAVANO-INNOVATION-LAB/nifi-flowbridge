name: Conversion bug
description: Report a reproducible import, analysis or export failure.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not upload credentials, customer data, or production flow files. Security vulnerabilities should use a private reporting route."
  - type: input
    id: revision
    attributes:
      label: Flowbridge version or commit
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Input format, target format and runtime versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and minimal synthetic fixture
      description: Include the exact operation and a small secret-free example.
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Expected behavior, actual behavior and compatibility findings
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: I removed credentials, personal information and production data.
          required: true
